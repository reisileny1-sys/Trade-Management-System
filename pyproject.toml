[project]
name = "quitanda-liro"
version = "0.1.0"
description = "Sistema web da Quitanda da Liro: catálogo, carrinho e retirada presencial"
readme = "README.md"
authors = [
    { name = "reisileny1-sys", email = "reisileny.1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
quitanda-liro = "quitanda_liro:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
