<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Quitanda da Liro</title>
  <link rel="icon" type="image/png" href="../assets/images/logo-quitanda-liro-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="..">
  <header id="site-header"></header>
  <main class="container secao">
    <h1>Administração</h1>
    <div id="msg-admin" hidden></div>
    <nav class="admin-navegacao" aria-label="Navegação administrativa">
      <a class="btn btn-verde" href="#form-produto-admin">Adicionar produto</a>
      <a class="btn btn-claro" href="#secao-pedidos">Todos os pedidos</a>
      <a class="btn btn-claro" href="#secao-catalogo">Produtos do catálogo</a>
    </nav>
    <section class="painel formulario">
      <h2 id="titulo-form-produto">Adicionar produto</h2>
      <form id="form-produto-admin">
        <input type="hidden" name="produto_id">
        <label>Nome do produto <input name="nome" required></label>
        <label>Categoria
          <select name="categoria">
            <option>Hortifruti</option>
            <option>Bebidas</option>
            <option>Limpeza</option>
          </select>
        </label>
        <label>Preço (R$) <input name="preco" type="number" step="0.01" min="0.01" required></label>
        <label>Unidade de medida <input name="unidade_medida" required placeholder="kg, g, L, ml, unidade"></label>
        <label>Imagem do produto <input name="imagem" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label>
        <label>Descrição <textarea name="descricao"></textarea></label>
        <div class="acoes-form">
          <button class="btn btn-verde" id="btn-salvar-produto" type="submit">Cadastrar produto</button>
          <button class="btn btn-claro" id="btn-cancelar-edicao" type="button" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>
    <section class="painel" id="secao-pedidos" style="margin-top:18px">
      <h2>Pedidos da loja</h2>
      <p class="ajuda">Atualize o andamento da preparação e da retirada.</p>
      <table class="admin-tabela">
        <thead>
          <tr><th>Nº</th><th>Cliente</th><th>Data</th><th>Total</th><th>Pagamento</th><th>Recebimento</th><th>Status</th><th>Alterar</th></tr>
        </thead>
        <tbody id="admin-pedidos"></tbody>
      </table>
    </section>
    <section class="painel" id="secao-catalogo" style="margin-top:18px">
      <h2>Produtos do catálogo</h2>
      <p class="ajuda">Visualize, edite ou remova os produtos disponíveis na loja.</p>
      <div id="admin-produtos" class="grade"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/api.js"></script>
  <script src="../js/carrinho.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pedidos.js"></script>
</body>
</html>
