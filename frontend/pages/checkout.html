<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalizar · Quitanda da Liro</title>
  <link rel="icon" type="image/png" href="../assets/images/logo-quitanda-liro-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="..">
  <header id="site-header"></header>
  <main class="container duas-colunas secao">
    <section>
      <h1>Confirmar retirada</h1>
      <div id="msg-checkout" hidden></div>
      <div id="resumo-checkout" class="painel"></div>
    </section>
    <aside class="painel">
      <h2>Pagamento e retirada</h2>
      <div class="caixa-info" id="info-loja"></div>
      <p>Não cobramos entrega. Não pedimos dados de cartão ou banco neste site. O pagamento é feito na loja, na hora da retirada, com PIX, cartão ou dinheiro.</p>
      <button class="btn btn-verde" id="confirmar-pedido" type="button">Confirmar pedido</button>
    </aside>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/api.js"></script>
  <script src="../js/carrinho.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pedidos.js"></script>
</body>
</html>
