<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Quitanda da Liro</title>
  <link rel="icon" type="image/png" href="../assets/images/logo-quitanda-liro-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="..">
  <header id="site-header"></header>
  <main class="container" style="max-width:520px">
    <section class="painel formulario">
      <h1>Entrar</h1>
      <div id="msg-auth" hidden></div>
      <form id="form-login">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required>
        <div class="acoes-form">
          <button class="btn btn-verde" type="submit">Entrar</button>
          <a class="btn btn-claro" href="cadastro.html">Criar conta</a>
        </div>
      </form>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/api.js"></script>
  <script src="../js/carrinho.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
