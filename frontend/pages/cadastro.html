<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro · Quitanda da Liro</title>
  <link rel="icon" type="image/png" href="../assets/imagens/logo-quitanda-liro-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="..">
  <header id="site-header"></header>
  <main class="container" style="max-width:560px">
    <section class="painel formulario">
      <h1>Criar conta</h1>
      <div id="msg-auth" hidden></div>
      <form id="form-cadastro">
        <label for="nome_completo">Nome completo</label>
        <input id="nome_completo" name="nome_completo" required>
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" required placeholder="000.000.000-00">
        <label for="celular">Celular</label>
        <input id="celular" name="celular" required placeholder="(00) 00000-0000">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" minlength="6" required>
        <label for="confirmacao_senha">Confirmar senha</label>
        <input id="confirmacao_senha" name="confirmacao_senha" type="password" required>
        <div class="acoes-form">
          <button class="btn btn-verde" type="submit">Cadastrar</button>
          <a class="btn btn-claro" href="login.html">Já tenho conta</a>
        </div>
      </form>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/api.js?v=2"></script>
  <script src="../js/carrinho.js"></script>
  <script src="../js/app.js?v=4"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
