<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho · Quitanda da Liro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="..">
  <header id="site-header"></header>
  <main class="container duas-colunas secao">
    <section>
      <h1>Seu cesto</h1>
      <div id="lista-carrinho"></div>
      <button class="btn btn-claro" id="limpar-carrinho" type="button">Limpar cesto</button>
    </section>
    <aside class="painel resumo">
      <h2>Total</h2>
      <div class="linha"><span>Itens</span><strong id="total-carrinho">R$ 0,00</strong></div>
      <p class="ajuda">Sem taxa de entrega. O valor final é confirmado no servidor.</p>
      <button class="btn btn-verde" id="finalizar-pedido" type="button" disabled>Finalizar pedido</button>
    </aside>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/api.js?v=2"></script>
  <script src="../js/carrinho.js"></script>
  <script src="../js/app.js?v=8"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pedidos.js?v=4"></script>
</body>
</html>
