<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quitanda da Liro</title>
  <link rel="icon" type="image/png" href="assets/imagens/logo-quitanda-liro-favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-root="" data-page="inicio">
  <header id="site-header"></header>
  <main class="container">
    <section class="hero-banner">
      <img
        class="hero-banner-imagem"
        src="assets/imagens/banner-quitanda.png"
        alt="Sabor de quitanda, cuidado em cada detalhe, com uma cesta de frutas e verduras."
        width="2000"
        height="720"
      >
      <a class="btn-rosa" href="#produtos">Ver produtos</a>
    </section>
    <section class="secao" id="produtos">
      <h2 class="titulo-secao">Nossos produtos</h2>
      <p class="sub">Escolha seus favoritos e aproveite!</p>
      <div class="filtros" id="filtros-home">
        <button type="button" data-filtro="" class="ativo">Todos</button>
        <button type="button" data-filtro="Hortifruti">Hortifruti</button>
        <button type="button" data-filtro="Bebidas">Bebidas</button>
        <button type="button" data-filtro="Limpeza">Limpeza</button>
      </div>
      <div id="destaques" class="grade"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/api.js?v=2"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/app.js?v=8"></script>
  <script src="js/auth.js"></script>
  <script src="js/produtos.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
